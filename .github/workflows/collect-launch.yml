# High-resolution samples around a launch, on top of the 6-hourly collect-stats.
# Same collection and files; GitHub runs schedules best-effort (often 10-60 min
# late), and every row carries its own timestamp. After WINDOW_END the workflow
# disables itself, so it never keeps running between launches. To reuse: set a
# new WINDOW_END and `gh workflow enable collect-launch.yml -R ActivityWatch/stats`.

name: Collect stats (launch window)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-stats
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  WINDOW_END: '2026-10-20T00:00:00Z'

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
    - name: Disable after the launch window
      id: window
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$(date -u +%s)" -ge "$(date -u -d "$WINDOW_END" +%s)" ]; then
          echo "Launch window ended ($WINDOW_END); disabling this workflow."
          gh workflow disable collect-launch.yml -R "$GITHUB_REPOSITORY"
          echo "open=false" >> "$GITHUB_OUTPUT"
        else
          echo "open=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@v4
      if: steps.window.outputs.open == 'true'
    - name: Install uv
      if: steps.window.outputs.open == 'true'
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.10"
    - name: Collect and append stats
      if: steps.window.outputs.open == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv sync
        uv run python3 collect_stats.py --csv >> data/stats.csv
        uv run python3 collect_stats.py --assets --csv >> data/stats-assets.csv
    - name: Commit and push
      if: steps.window.outputs.open == 'true'
      run: |
        git config --local user.email "noreply@github.com"
        git config --local user.name "GitHub Action"
        git add data/stats.csv data/stats-assets.csv
        git diff --cached --quiet && exit 0
        git commit -m "chore: update stats (launch window)"
        for i in 1 2 3 4 5; do
          git push origin HEAD:master && exit 0
          sleep $((i * 5))
          git pull --rebase origin master
        done
        exit 1
